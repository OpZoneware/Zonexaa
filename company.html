<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Company Documents · Zonexa</title>
<meta name="theme-color" content="#0a1f2c"/>
<link rel="stylesheet" href="css/app.css"/>
</head>
<body>
<main class="main">
  <div class="page-head"><div><h1>Company Documents</h1>
    <p>Company folders, registrations and supporting documents.</p></div></div>
  <div class="filters"><label for="companySelect">Company</label>
    <select id="companySelect" disabled><option>Loading companies…</option></select></div>
  <div class="note">Each company has its own register. A linked folder does not confirm that its documents are current or complete.</div>
  <div class="panel"><div class="panel-head"><h2 id="registerTitle">Document register</h2></div>
    <div class="panel-body tight" id="docs">Loading…</div></div>
</main>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/shell.js"></script>
<script>
let companyRows = [];
let companyLoad = 0;
const companySelect = document.getElementById('companySelect');
const companyPanel = document.getElementById('docs');
function companyLink(value) {
  try { const u = new URL(value); return ['https:', 'http:'].includes(u.protocol) ? u.href : ''; }
  catch (err) { return ''; }
}
async function loadCompany() {
  const company = companySelect.value;
  const request = ++companyLoad;
  companyPanel.textContent = 'Loading documents…';
  document.getElementById('registerTitle').textContent = company;
  try {
    const saved = await API.companyDocuments(company);
    if (request !== companyLoad) return;
    const templates = DOC_REQUIREMENTS.filter(d => d.scope === 'entity');
    const known = new Set(templates.map(d => d.name));
    companyRows = templates.map(d => Object.assign({status:'Not Started',link:'',expiry:'',notes:''}, d,
      saved.find(s => s.name === d.name) || {})).concat(saved.filter(d => !known.has(d.name)));
    const editable = Session.canManage();
    companyPanel.innerHTML = '<div class="table-wrap"><table class="z"><thead><tr>' +
      '<th>Document / folder</th><th>Status</th><th>Expiry</th><th>Link</th></tr></thead><tbody>' +
      companyRows.map((d,i) => '<tr><td><b>' + esc(d.name) + '</b>' +
        (d.notes ? '<p class="who">' + esc(d.notes) + '</p>' : '') + '</td>' +
        '<td><select data-row="' + i + '" data-field="status" ' + (editable ? '' : 'disabled') + '>' +
        STEP_STATUSES.map(s => '<option' + (s === d.status ? ' selected' : '') + '>' + esc(s) + '</option>').join('') +
        '</select></td><td><input type="date" data-row="' + i + '" data-field="expiry" value="' + esc(d.expiry || '') + '" ' +
        (editable ? '' : 'disabled') + '/></td><td><input type="url" data-row="' + i + '" data-field="link" value="' +
        esc(d.link || '') + '" ' + (editable ? '' : 'disabled') + '/>' +
        (companyLink(d.link) ? '<a class="linkpill" target="_blank" rel="noopener noreferrer" href="' + esc(companyLink(d.link)) + '">' +
          (d.link.includes('/drive/folders/') ? 'Open folder' : 'Open file') + '</a>' : '') + '</td></tr>').join('') +
        '</tbody></table></div>';
    companyPanel.querySelectorAll('[data-field]').forEach(input => input.addEventListener('change', async () => {
      const field = input.dataset.field;
      const name = companyRows[Number(input.dataset.row)].name;
      if (field === 'link' && input.value && !companyLink(input.value)) {
        toast('Enter a full http or https link', 'error'); return;
      }
      input.disabled = true;
      try {
        await API.saveCompanyDocument(company, name, {[field]:input.value});
        toast('Saved');
        if (companySelect.value === company) await loadCompany();
      } catch (err) { toast('Not saved: ' + err.message, 'error'); input.disabled = false; }
    }));
  } catch (err) {
    if (request === companyLoad) companyPanel.textContent = 'Could not load the company register: ' + err.message;
  }
}
(async function () {
  if (!Session.require()) return;
  Shell.render('company');
  try {
    const companies = await API.companies();
    companySelect.innerHTML = companies.map(c => '<option>' + esc(c) + '</option>').join('');
    if (!companies.length) { companyPanel.textContent = 'No companies recorded yet.'; return; }
    companySelect.disabled = false;
    companySelect.addEventListener('change', loadCompany);
    await loadCompany();
  } catch (err) { companyPanel.textContent = 'Could not load companies: ' + err.message; }
})();
</script>
</body>
</html>
