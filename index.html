<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Sign in · Zonexa</title>
<meta name="theme-color" content="#0a1f2c"/>
<link rel="stylesheet" href="css/app.css"/>
</head>
<body>

<div class="auth">
  <main class="auth-panel">
    <div class="brand">Zonexa</div>
    <div class="brand-sub">Zoneware Limited</div>

    <h1>Sign in</h1>
    <p class="sub">Use your Zoneware Workspace account.</p>

    <div id="gbtn" style="margin-bottom:18px"></div>

    <form id="form" style="display:none">
      <div class="field">
        <label for="email">Work email address</label>
        <input id="email" type="email" required autocomplete="username"
               placeholder="name@redwarelimited.com"/>
      </div>
      <button class="btn full" type="submit">Continue</button>
    </form>

    <div class="msg" id="msg" role="alert"></div>

    <p class="fineprint" id="fine"></p>
  </main>

  <aside class="auth-visual">
    <div class="copy">
      <div class="tag">Project Tracking System</div>
      <h2>Every project.<br/>Every stage.<br/>One system.</h2>
      <p>Tender through execution, certification, payment and retention —
         tracked against the Project Management SOP.</p>
      <div class="stats">
        <div><b>64</b><span>SOP steps</span></div>
        <div><b>65</b><span>Documents</span></div>
        <div><b>6</b><span>Modules</span></div>
      </div>
    </div>
  </aside>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/shell.js"></script>
<script>
const msg  = document.getElementById('msg');
const fine = document.getElementById('fine');

if (Store.session()) location.replace('board.html');

function done(result) {
  if (result.ok) { location.href = 'board.html'; return; }
  msg.className = 'msg error';
  msg.textContent = result.error;
}

function useDirectory() {
  /* Directory sign-in is a setup convenience only. Once the API is
     connected it is switched off — a typed address is not a
     credential, and the back end will reject it. */
  if (API.connected()) {
    msg.className = 'msg error';
    msg.textContent = 'Google sign-in is unavailable. Check CONFIG.GOOGLE_CLIENT_ID.';
    return;
  }
  document.getElementById('form').style.display = '';
  fine.textContent =
    'Workspace sign-in activates once the OAuth client ID is configured. ' +
    'Until then, registered addresses may sign in directly.';
}

window.addEventListener('load', function () {
  if (!Auth.googleReady()) { useDirectory(); return; }
  /* give the Google library a moment to attach */
  setTimeout(function () {
    if (!Auth.mountGoogleButton('gbtn', done)) useDirectory();
  }, 350);
});

document.getElementById('form').addEventListener('submit', function (e) {
  e.preventDefault();
  msg.className = 'msg';
  msg.textContent = 'Checking…';
  Auth.signInByEmail(document.getElementById('email').value).then(done);
});
</script>
</body>
</html>
